{% extends 'core_app/base.html' %}
{% block title %}ZAN | Create Account{% endblock %}

{% block content %}
<div class="auth-container" style="max-width: 500px;">
    <h2 class="auth-title" style="margin-bottom: 0.5rem;">Join ZAN</h2>
    <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">Select Seller account to list items on ZAN portal.</p>
    
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" required>
        </div>
        <div class="form-group">
            <label>Account Role</label>
            <select name="role">
                <option value="BUYER">Buyer / Private Client</option>
                <option value="SELLER">Merchant / Seller</option>
            </select>
        </div>
        <div class="form-group">
            <label>Company / Brand Name (Sellers Only)</label>
            <input type="text" name="company_name">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="confirm_password" required>
        </div>
        <button type="submit" class="btn-gold" style="width: 100%; margin-top: 1rem;">Create Account</button>
    </form>
</div>
{% endblock %}
