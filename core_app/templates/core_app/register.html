{% extends 'core_app/base.html' %}
{% load static %}
{% block title %}ZAN | Create Account{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'core_app/css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-container auth-container-register">
    <h2 class="auth-title auth-title-register">Join ZAN</h2>
    <p class="auth-intro">Select Seller account to list items on ZAN portal.</p>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" required>
        </div>
        <div class="form-group">
            <label>Account Role</label>
            <select name="role">
                <option value="BUYER">Buyer / Private Client</option>
                <option value="SELLER">Merchant / Seller</option>
            </select>
        </div>
        <div class="form-group">
            <label>Company / Brand Name (Sellers Only)</label>
            <input type="text" name="company_name">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="confirm_password" required>
        </div>
        <button type="submit" class="btn-gold auth-submit">Create Account</button>
    </form>
</div>
{% endblock %}
